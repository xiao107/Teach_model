<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek 数据助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="eyebrow">DeepSeek 驱动</p>
        <h1>数据科学聊天助手</h1>
        <p class="subtitle">加载数据、探索数据、获得指导，一切都在对话中完成。</p>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button id="toggle-sidebar" class="ghost-btn" title="折叠/展开侧栏">☰</button>
          <button id="new-chat" class="primary-btn">
            <span class="icon">＋</span>
            <span class="label">新建对话</span>
          </button>
        </div>
        <div class="session-list" id="session-list"></div>
      </aside>

      <main class="chat-panel">
        <div id="chat-box" class="chat-box"></div>
        <div class="input-row">
          <input id="user-input" type="text" placeholder="向助手提问，例如：加载 Iris 数据集" autocomplete="off">
          <button id="send-button">发送</button>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
