<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek 数据助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="eyebrow">DeepSeek 驱动</p>
        <h1>数据科学聊天助手</h1>
        <p class="subtitle">加载数据、探索数据、获得指导，一切都在对话中完成。</p>
      </div>
    </header>

    <main>
      <div id="chat-box" class="chat-box"></div>
      <div class="input-row">
        <input id="user-input" type="text" placeholder="向助手提问，例如：加载 Iris 数据集" autocomplete="off">
        <button id="send-button">发送</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
